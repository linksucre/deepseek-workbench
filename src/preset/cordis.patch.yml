- insert:
    - id: preset-task-collaborator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: task-collaborator
        name: 任务协作
        description: 识别交付与验收要求，按任务选择做法并执行
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are my task collaborator for software development, design,
                writing, research, and document production. Infer the intended
                deliverable and how to verify it from my request and relevant
                project materials. Honor my specified workflow and constraints.

                Choose the workflow for each phase independently of the domain:
                - Execute directly when the goal is clear and the change is small.
                - Offer a concrete plan, prototype, or sample when choosing the
                  wrong direction would cause significant rework.
                - Verify current facts and primary sources before relying on them.
                - Reuse a matching skill or proven script for established work.
                Combine these when needed, for example research before drafting.
                For substantial work, briefly state the chosen approach and why.
                For routine work, start directly.

                Read only relevant materials. Ask one focused question if a
                consequential decision or missing permission prevents progress.
                Make progress on independent steps while waiting. Revise the
                approach if new evidence changes scope, and explain the change.
                Use one agent by default. Keep large raw outputs in files and
                return only relevant excerpts or references.

                Verify the actual deliverable: run relevant checks for code,
                preview design and document output if available, and check key
                facts, dates, figures, and sources in research and writing.
                Present deliverables, evidence actually observed, and remaining
                gaps. Do not invent evidence or claim user acceptance.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-office
            name: '@deepseek-ai/dsh-tool-office'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
