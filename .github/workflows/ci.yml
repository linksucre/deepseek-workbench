name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    name: Repository gate
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm run check
      - name: Check change documentation
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run check -- --base "$BASE_SHA"
      - name: Classify integration scope
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --no-renames --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/workbench-paths"
          docs_only=false
          if [ -s "$RUNNER_TEMP/workbench-paths" ]; then
            docs_only=true
            while IFS= read -r -d '' path; do
              case "$path" in
                README.md|CHANGELOG.md|ACCEPTANCE.md|TASKS.md|TEST_PLAN.md|docs/*.md) ;;
                *) docs_only=false; break ;;
              esac
            done < "$RUNNER_TEMP/workbench-paths"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
  integration:
    name: Harness integration
    needs: repository
    if: ${{ always() }}
    runs-on: ${{ needs.repository.outputs.docs_only == 'true' && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 30
    steps:
      - name: Require successful repository gate
        if: needs.repository.result != 'success'
        run: exit 1
      - name: Record documentation fast path
        if: needs.repository.outputs.docs_only == 'true'
        run: echo 'Only allowlisted Markdown paths changed. Repository and documentation checks passed.' >> "$GITHUB_STEP_SUMMARY"
      - if: needs.repository.outputs.docs_only != 'true'
        uses: actions/checkout@v4
      - if: needs.repository.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Read pinned Harness version
        if: needs.repository.outputs.docs_only != 'true'
        id: baseline
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const b=JSON.parse(readFileSync("harness-baseline.json")); console.log("repository="+b.repository); console.log("commit="+(b.upstreamCommit ?? b.commit))' >> "$GITHUB_OUTPUT"
      - if: needs.repository.outputs.docs_only != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.baseline.outputs.repository }}
          ref: ${{ steps.baseline.outputs.commit }}
          path: upstream
          persist-credentials: false
      - name: Materialize pinned Harness
        if: needs.repository.outputs.docs_only != 'true'
        run: node scripts/materialize-harness.mjs "$GITHUB_WORKSPACE/upstream"
      - name: Build pinned Harness
        if: needs.repository.outputs.docs_only != 'true'
        working-directory: upstream
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm run build
      - if: needs.repository.outputs.docs_only != 'true'
        run: npm ci
      - if: needs.repository.outputs.docs_only != 'true'
        run: npm run test:smoke -- "$GITHUB_WORKSPACE/upstream"
      - if: needs.repository.outputs.docs_only != 'true'
        run: node tests/integration/storage-smoke.mjs "$GITHUB_WORKSPACE/upstream"
      - if: needs.repository.outputs.docs_only != 'true'
        run: node tests/integration/application-smoke.mjs "$GITHUB_WORKSPACE/upstream"
      - if: needs.repository.outputs.docs_only != 'true'
        run: node tests/integration/host-delivery-smoke.mjs "$GITHUB_WORKSPACE/upstream" --review-recovery-regressions
      - name: Verify a confirmed forward refusal
        if: needs.repository.outputs.docs_only != 'true'
        run: node tests/integration/host-delivery-smoke.mjs "$GITHUB_WORKSPACE/upstream" --review-recovery-regressions=forward-pre-admission
      - name: Check out the pre-v2 Workbench baseline
        if: needs.repository.outputs.docs_only != 'true'
        uses: actions/checkout@v4
        with:
          ref: 50f748bb2ad59f6a583ddeedc0cf6065cd165308
          path: preview-workbench
          persist-credentials: false
      - name: Install pre-v2 Workbench dependencies
        if: needs.repository.outputs.docs_only != 'true'
        working-directory: preview-workbench
        run: npm ci
      - name: Verify API v2 profile migration
        if: needs.repository.outputs.docs_only != 'true'
        run: |
          node tests/integration/host-delivery-smoke.mjs "$GITHUB_WORKSPACE/upstream" \
            --review-profile-upgrade-from="$GITHUB_WORKSPACE/preview-workbench" --verify-api-upgrade
      - if: needs.repository.outputs.docs_only != 'true'
        run: node tests/integration/usage-host-smoke.mjs "$GITHUB_WORKSPACE/upstream"
      - name: Verify persisted task context
        if: needs.repository.outputs.docs_only != 'true'
        run: node tests/integration/context-smoke.mjs "$GITHUB_WORKSPACE/upstream"
      - name: Verify native worktree write isolation
        if: needs.repository.outputs.docs_only != 'true'
        run: node tests/integration/worktree-isolation-smoke.mjs "$GITHUB_WORKSPACE/upstream"
      - name: Measure warm task list pagination
        if: needs.repository.outputs.docs_only != 'true'
        run: node tests/integration/list-performance.mjs "$GITHUB_WORKSPACE/upstream"
      - name: Install pinned browser
        if: needs.repository.outputs.docs_only != 'true'
        working-directory: upstream/apps/web
        run: corepack pnpm exec playwright install chromium
      - name: Verify browser workflows from installed archive
        if: needs.repository.outputs.docs_only != 'true'
        run: |
          package_dir="$(mktemp -d)"
          archive="$(npm pack --pack-destination "$package_dir" --silent)"
          npm install --prefix "$package_dir/install" --no-audit --no-fund "$package_dir/$archive"
          export WORKBENCH_OVERLAY_GENERATOR="$package_dir/install/node_modules/deepseek-workbench/scripts/source-overlay.mjs"
          node tests/integration/browser-workbench.mjs "$GITHUB_WORKSPACE/upstream"
